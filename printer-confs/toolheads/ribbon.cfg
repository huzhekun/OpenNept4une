# Pin mapping for the original ribbon-cable printheads (extruder/probe wired
# directly to the mainboard MCU). These values match the pins that were
# previously hardcoded in base.cfg, so selecting "ribbon" (the default)
# produces output identical to before toolhead variants were introduced.

extruder_step_pin=PA5
extruder_dir_pin=!PA6
extruder_enable_pin=!PA4
extruder_heater_pin=PA7
extruder_sensor_pin=PA1
extruder_uart_pin=PC4

probe_pin=^PA11

toolhead_mcu_include=
toolhead_extra_sections=
