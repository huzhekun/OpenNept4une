# USB-C toolhead fan layout for N4 / N4 Pro.
# Toolhead-side fans (part cooling, hotend, aux) move to the THR MCU.
# Mainboard fan4/fan0 stay on the same pins as the ribbon variant.

[fan]
pin: THR:PB1

[heater_fan hotend_fan]
pin: THR:PB0
heater: extruder
heater_temp: 50.0

[fan_generic fan2]
pin: THR:PB11

[fan_generic fan4]
pin: PC9

[controller_fan mainboard_fan]
pin: PA8
fan_speed: 1.0
idle_speed: 0.5
idle_timeout: 43200 # 50% speed for 12h then OFF
shutdown_speed: 1
heater: extruder, heater_bed
stepper: stepper_x, stepper_y, stepper_z, extruder
