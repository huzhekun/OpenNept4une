# Pin mapping for the USB-C Klipper toolhead variants (extruder/probe/fans/LED
# wired through a separate STM32F103xE "THR" MCU exposed at
# /dev/serial/by-id/usb-Klipper_stm32f103xe_*).
#
# Pin names match the official Elegoo Pro/Plus/Max USB-C toolhead configs.
# N4 is assumed to share the Pro mapping.

extruder_step_pin=THR:PB14
extruder_dir_pin=THR:PB13
extruder_enable_pin=!THR:PA8
extruder_heater_pin=THR:PA3
extruder_sensor_pin=THR:PA0
extruder_uart_pin=THR:PB15

probe_pin=^THR:PB12

toolhead_mcu_include=[include MCU_ID.cfg]

# Extra sections only relevant to the USB-C toolhead: an addressable LED on
# the toolhead. The lis2dw/adxl345 accelerometer setup is handled per-model
# via the "accelerometer" section override (see section_accel_usb-c_*.cfg).
toolhead_extra_sections=[neopixel toolhead_led]\npin: THR:PB10\nchain_count: 1\ncolor_order: GRBW\ninitial_RED: 1.0\ninitial_GREEN: 1.0\ninitial_BLUE: 1.0\ninitial_WHITE: 1.0
